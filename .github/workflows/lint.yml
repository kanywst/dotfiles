name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: zsh
        env:
          SHELLCHECK_OPTS: -x -e SC1090,SC1091

  zsh-syntax:
    name: zsh -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: syntax check .zshrc and conf.d
        run: |
          set -e
          zsh -n zsh/.zshrc
          for f in zsh/conf.d/*.zsh; do
            echo "== $f"
            zsh -n "$f"
          done

  trust-store-layout:
    name: homebrew trust store layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Homebrew's write_trust_store() follows one symlink and refuses if the
      # target is another symlink. A symlink stowed out of homebrew/ makes
      # ~/.homebrew/trust.json a two-hop chain, which aborts the brew step of
      # every `darwin-rebuild switch`. install.sh links that path directly.
      - name: no symlinks tracked under homebrew/
        run: |
          links=$(git ls-files -s homebrew | awk '$1 == "120000" { print $4 }')
          if [ -n "$links" ]; then
            printf '::error::symlink tracked under homebrew/: %s\n' "$links"
            exit 1
          fi

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  nix-flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      # Magic Nix Cache was sunset upstream; --no-build caches nothing anyway.
      - name: flake check (no build — darwin attrs need macOS)
        run: nix flake check --no-build
