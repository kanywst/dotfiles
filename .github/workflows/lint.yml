name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: zsh
        env:
          SHELLCHECK_OPTS: -x -e SC1090,SC1091

  zsh-syntax:
    name: zsh -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: syntax check .zshrc and conf.d
        run: |
          set -e
          zsh -n zsh/.zshrc
          for f in zsh/conf.d/*.zsh; do
            echo "== $f"
            zsh -n "$f"
          done

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  nix-flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: flake check (no build — darwin attrs need macOS)
        run: nix flake check --no-build
