# AeroSpace — i3-like tiling WM for macOS. Synced via stow.
# Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# Reload after edits with `aerospace reload-config` or alt-shift-c.
# Does NOT need SIP disabled.

start-at-login = true
after-startup-command = []
after-login-command = []

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus (these are top-level, NOT inside [gaps])
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# Keep menubar visible (top-level)
automatically-unhide-macos-hidden-apps = false

# Auto-balance gaps. Match Ghostty padding so windows look consistent.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[key-mapping]
preset = 'qwerty'

# --- main mode ---
[mode.main.binding]

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Layout
alt-slash    = 'layout tiles horizontal vertical'
alt-comma    = 'layout accordion horizontal vertical'
alt-f        = 'fullscreen'
alt-shift-space = 'layout floating tiling'

# Workspaces (alt + number)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace (alt-shift + number)
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Service
alt-shift-c = 'reload-config'
alt-shift-q = 'close'
alt-shift-semicolon = 'mode service'

# --- service mode ---
[mode.service.binding]
esc = ['reload-config', 'mode main']
r   = ['flatten-workspace-tree', 'mode main']
f   = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Float specific apps that don't tile well
[[on-window-detected]]
if.app-id = 'com.apple.SystemSettings'  # macOS Ventura+
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'  # pre-Ventura, kept for back-compat
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'
