# Jujutsu (jj) — git-compatible VCS, synced via stow.
# Docs: https://jj-vc.github.io/jj/latest/config/
#
# Recommended workflow: colocate jj with git so teammates keep using git
# while you use jj on the same repo:
#
#   cd <repo>
#   jj git init --colocate
#
# Useful commands (aliased in zsh/conf.d/50-aliases.zsh):
#   jjs / jjl / jjn / jje / jjd / jjp

[user]
name = "kanywst"
email = "niwatakuma@icloud.com"

[ui]
default-command = "log"
# Pager: array form lets us pass args. `[ui.pager-cmd]` doesn't exist in jj.
pager = ["delta", "--paging=auto"]
diff.format = "git"
# delta is a pager (display-only) — using it as diff-editor would break
# `jj split` / `jj squash -i`. Use jj's built-in terminal diff editor.
diff-editor = ":builtin"
# jj has no `:builtin` text editor — that string only exists for diff-editor.
# Omit ui.editor; jj falls back to $JJ_EDITOR / $EDITOR / $VISUAL / vi.

[git]
push-bookmark-prefix = "kanywst/push-"

# `git.auto-local-bookmark` is deprecated since jj 0.41; the replacement is
# per-remote tracking. `*` matches all bookmark names.
[remotes.origin]
auto-track-bookmarks = "*"

[snapshot]
max-new-file-size = "10MiB"

[revsets]
log = "@ | ancestors(immutable_heads().., 8) | trunk()"
short-prefixes = "reachable(@, all())"

[template-aliases]
"format_short_id(id)" = "id.shortest(8)"

# Aliases at the jj-CLI level (separate from shell aliases)
[aliases]
l    = ["log", "-r", "::@"]
ll   = ["log"]
s    = ["status"]
d    = ["diff"]
n    = ["new"]
e    = ["edit"]
sq   = ["squash"]
push = ["git", "push"]
fetch = ["git", "fetch"]
sync = ["git", "fetch", "--all-remotes"]
