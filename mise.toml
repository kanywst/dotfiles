# mise tasks for this repo. Run with `mise run <name>` or `mise r <name>`.
# List with `mise tasks ls`.

[tools]
node = "lts"

[tasks.lint]
description = "Run all linters (zsh -n, shellcheck, markdownlint, actionlint)"
# `|| exit 1` inside the for-loop is load-bearing: a bare `for` returns the
# exit status of the *last* iteration, masking earlier failures.
run = [
    "zsh -n zsh/.zshrc",
    "for f in zsh/conf.d/*.zsh; do [ -f \"$f\" ] || continue; echo == $f; zsh -n \"$f\" || exit 1; done",
    "shellcheck -e SC1090,SC1091 install.sh tests/*.sh 'bin/.local/bin/bump' 'bin/.local/bin/bootstrap'",
    "npx --yes markdownlint-cli2 '**/*.md'",
    "actionlint .github/workflows/*.yml",
]

[tasks.test]
description = "Run the bump regression suite (also under macOS's bash 3.2)"
# Twice on purpose: `#!/usr/bin/env bash` picks up brew's bash 5 here, but on a
# fresh Mac it finds /bin/bash 3.2, where `${arr[@]}` on an empty array under
# `set -u` is a hard error. The second run is the only thing that catches it.
run = [
    "tests/bump.test.sh",
    "if [ -x /bin/bash ]; then BUMP_TEST_SHELL=/bin/bash tests/bump.test.sh; fi",
]

[tasks.install]
description = "Stow all packages into $HOME"
run = "./install.sh"

[tasks.restow]
description = "Re-link stow packages (recover from drift)"
run = "./install.sh --restow"

[tasks.uninstall]
description = "Unlink all stowed packages"
run = "./install.sh --delete"

[tasks.darwin-switch]
description = "Apply nix-darwin flake (macOS defaults + brew bundle)"
# Delegates to `bump` rather than keeping a second copy of the sudo/USER/--impure
# incantation: it lived here AND in the script, and a fix to one never reached
# the other. `--only darwin` is the apply step alone — `flake` is what bumps the
# inputs — and `-v` streams the build instead of hiding it behind a spinner.
# DARWIN_MAS still works the same way: `DARWIN_MAS=1 mise run darwin-switch`.
run = 'DOTFILES_DIR="${MISE_PROJECT_ROOT:-$PWD}" bin/.local/bin/bump --only darwin -v'

[tasks.darwin-check]
description = "Evaluate the flake without building"
run = "nix flake check --no-build"

[tasks.update]
description = "Bump flake inputs and brew (formulae + casks)"
# Same delegation as darwin-switch: this used to hand-copy the script's brew
# command chain and carry a "keep these in sync" comment doing a compiler's job.
run = 'DOTFILES_DIR="${MISE_PROJECT_ROOT:-$PWD}" bin/.local/bin/bump --only flake,brew,brew-cask -v'

[tasks.bootstrap]
description = "Install non-brew layers (mise runtimes, rustup, krew, gh ext)"
run = "bin/.local/bin/bootstrap"

[tasks.hooks]
description = "Install lefthook git hooks"
run = "lefthook install"

[tasks.scan]
description = "Scan repo for secrets with gitleaks"
run = "gitleaks detect --no-banner --redact"
