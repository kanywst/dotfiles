# mise tasks for this repo. Run with `mise run <name>` or `mise r <name>`.
# List with `mise tasks ls`.

[tools]
node = "lts"

[tasks.lint]
description = "Run all linters (zsh -n, shellcheck, markdownlint, actionlint)"
# `|| exit 1` inside the for-loop is load-bearing: a bare `for` returns the
# exit status of the *last* iteration, masking earlier failures.
run = [
    "zsh -n zsh/.zshrc",
    "for f in zsh/conf.d/*.zsh; do [ -f \"$f\" ] || continue; echo == $f; zsh -n \"$f\" || exit 1; done",
    "shellcheck -e SC1090,SC1091 install.sh 'bin/.local/bin/work'",
    "npx --yes markdownlint-cli2 '**/*.md'",
    "actionlint .github/workflows/*.yml",
]

[tasks.install]
description = "Stow all packages into $HOME"
run = "./install.sh"

[tasks.restow]
description = "Re-link stow packages (recover from drift)"
run = "./install.sh --restow"

[tasks.uninstall]
description = "Unlink all stowed packages"
run = "./install.sh --delete"

[tasks.darwin-switch]
description = "Apply nix-darwin flake (macOS defaults + brew bundle)"
# - PATH propagated through sudo because nix lives in the user's nix profile.
# - USER + --impure: flake.nix reads the name from getEnv "USER", and sudo
#   resets USER to root; without these the `.#$who` attr doesn't exist.
# - HOME deliberately NOT propagated, else nix writes root-owned ~/.cache/nix.
# - `$(whoami)` is captured BEFORE sudo so it resolves to the calling user;
#   the flake's `username` is the one place that needs editing on a fork.
# - First run before nix-darwin is installed has no `darwin-rebuild` binary,
#   so fall back to `nix run`.
run = '''
path=$PATH; who=$(whoami)
if command -v darwin-rebuild >/dev/null 2>&1; then
    sudo env "PATH=$path" "USER=$who" darwin-rebuild switch --impure --flake ".#$who"
else
    echo "darwin-rebuild not on PATH — running first-time bootstrap via nix run"
    # Explicit GitHub URL avoids depending on the `nix-darwin` registry alias,
    # which isn't guaranteed on a fresh machine without a flake registry fetch.
    sudo env "PATH=$path" "USER=$who" \
        nix run github:LnL7/nix-darwin/master#darwin-rebuild -- switch --impure --flake ".#$who"
fi
'''

[tasks.darwin-check]
description = "Evaluate the flake without building"
run = "nix flake check --no-build"

[tasks.update]
description = "Bump flake inputs and brew bundle"
# Match work's do_brew: casks and cleanup too.
run = [
    "nix flake update",
    "brew update && brew upgrade && brew upgrade --cask && brew cleanup",
]

[tasks.bootstrap]
description = "Install non-brew layers (mise runtimes, rustup, krew, gh ext)"
run = "bin/.local/bin/bootstrap"

[tasks.hooks]
description = "Install lefthook git hooks"
run = "lefthook install"

[tasks.scan]
description = "Scan repo for secrets with gitleaks"
run = "gitleaks detect --no-banner --redact"
