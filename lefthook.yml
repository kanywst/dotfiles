# lefthook — fast, parallel git hooks. Install once with `lefthook install`
# (or `mise run hooks`). Hooks here mirror the CI matrix so PRs land green.

pre-commit:
  parallel: true
  commands:
    zsh-syntax:
      glob: "zsh/conf.d/*.zsh"
      # `zsh -n a.zsh b.zsh` only checks the first file (others become $1, $2).
      # Loop per file; the trailing `""` + skip prevents `for f in ; do` syntax
      # error if lefthook ever passes an empty {staged_files}.
      run: 'for f in {staged_files} ""; do [ -n "$f" ] || continue; zsh -n "$f" || exit 1; done'
    zshrc-syntax:
      glob: "zsh/.zshrc"
      run: 'for f in {staged_files} ""; do [ -n "$f" ] || continue; zsh -n "$f" || exit 1; done'
    shellcheck:
      glob: "*.sh"
      run: shellcheck -e SC1090,SC1091 {staged_files}
    shellcheck-bin:
      # `work` is bash but has no .sh extension, so the glob above skips it.
      glob: "bin/.local/bin/*"
      run: shellcheck -e SC1090,SC1091 {staged_files}
    markdownlint:
      glob: "*.md"
      run: npx --yes markdownlint-cli2 {staged_files}
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact

pre-push:
  parallel: true
  commands:
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {push_files}
    flake-check:
      glob: "flake.{nix,lock}"
      run: nix flake check --no-build
