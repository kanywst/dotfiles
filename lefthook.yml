# lefthook — fast, parallel git hooks. Install once with `lefthook install`
# (or `mise run hooks`). Hooks here mirror the CI matrix so PRs land green.

pre-commit:
  parallel: true
  commands:
    zsh-syntax:
      glob: "zsh/conf.d/*.zsh"
      # `zsh -n a.zsh b.zsh` only checks the first file (others become $1, $2).
      # Loop per file; the trailing `""` + skip prevents `for f in ; do` syntax
      # error if lefthook ever passes an empty {staged_files}.
      run: 'for f in {staged_files} ""; do [ -n "$f" ] || continue; zsh -n "$f" || exit 1; done'
    zshrc-syntax:
      glob: "zsh/.zshrc"
      run: 'for f in {staged_files} ""; do [ -n "$f" ] || continue; zsh -n "$f" || exit 1; done'
    shellcheck:
      glob: "*.sh"
      run: shellcheck -e SC1090,SC1091 {staged_files}
    shellcheck-bin:
      # `bump`/`bootstrap` are bash but have no .sh extension, so the glob
      # above skips them.
      glob: "bin/.local/bin/*"
      run: shellcheck -e SC1090,SC1091 {staged_files}
    markdownlint:
      glob: "*.md"
      run: npx --yes markdownlint-cli2 {staged_files}
    trust-coverage:
      # Pins the invariant that every third-party entry in flake.nix is also in
      # the trust store. Today nix-darwin upholds it for free by emitting
      # `trusted: true` in its Brewfile; this fails loudly if that ever stops.
      # See the header of the script — it is a backstop, and the untrusted-tap
      # failure it descends from is caught by bump's probe, not by this.
      # Static (two file reads, no Homebrew), so pre-commit rather than pre-push.
      glob: "{flake.nix,homebrew/.config/homebrew/trust.json}"
      run: tests/trust-coverage.sh
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact

pre-push:
  parallel: true
  commands:
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {push_files}
    bump-tests:
      # ~15s. Pre-push rather than pre-commit: the suite forks a run of bump per
      # assertion, which is too slow to sit in front of every commit.
      # The suite itself is in the glob: a push that only touches tests/ used to
      # skip this and let a broken suite through to CI, which is exactly what
      # happened on the push that fixed it.
      glob: "{bin/.local/bin/bump,tests/*.sh}"
      run: tests/bump.test.sh
    flake-check:
      glob: "flake.{nix,lock}"
      run: nix flake check --no-build
